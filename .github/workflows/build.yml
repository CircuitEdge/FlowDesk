name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore FlowDeck.csproj

      - name: Build
        run: dotnet build FlowDeck.csproj --configuration Release --no-restore

      - name: Validate publish profile
        run: dotnet publish FlowDeck.csproj --configuration Release --no-restore --property:PublishProfile=FolderProfile
